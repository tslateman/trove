name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --all-groups
      # bundles/registry.yaml is the public bundle. Until one is committed,
      # the demo bundle ships as a live preview of the catalog.
      - name: Build the registry
        run: |
          if [ -f bundles/registry.yaml ]; then
            uv run trove --bundle bundles/registry.yaml --out out build
            uv run trove --bundle bundles/registry.yaml --out out catalog
          else
            uv run trove --bundle bundles/demo.yaml --out out build --no-pin
            uv run trove --bundle bundles/demo.yaml --out out --offline catalog
          fi
      # Create the Pages project once before the first run:
      #   wrangler pages project create trove --production-branch main
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=trove --branch=main
      - name: Say where it landed
        run: echo "${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
