# Records docs/demo-lint.gif. The fixture repo plus a second fixture whose two
# skills fail a lint check on purpose, so the flag has something to show.
name: lint-demo
description: Fixture skills, two of them flagged on purpose
owner:
  name: tslateman

sources:
  demo:
    local: ../tests/fixtures/demo-repo
  flawed:
    local: ../tests/fixtures/lint-repo

plugins:
  - name: demo
    source: demo
    version: 0.1.0
    category: development
    description: Every fixture skill
  - name: flawed
    source: flawed
    version: 0.1.0
    category: development
    description: Two skills the linter flags
