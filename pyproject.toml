[project]
name = "trove"
version = "0.1.2"
description = "Registry for Claude Code skills — index, bundle, publish, browse"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tommy Slater" }]
keywords = ["claude-code", "skills", "registry", "marketplace", "plugins"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
]
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/tslateman/trove"
Repository = "https://github.com/tslateman/trove"
Issues = "https://github.com/tslateman/trove/issues"

[project.scripts]
trove = "trove.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trove"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
