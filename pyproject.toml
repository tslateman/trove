[project]
name = "trove"
version = "0.1.0"
description = "Registry for Claude Code skills — index, bundle, publish, browse"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
trove = "trove.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trove"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
