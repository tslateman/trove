output: out/demo-bundled.webm
url: http://127.0.0.1:8787/
viewport:
  width: 1280
  height: 800
cursor: true
wait_for: "article.row >> nth=0"
scenes:
  - name: Open the catalog
    do:
      - pause: 1.5
  - name: Search for a skill that ships files beside SKILL.md
    do:
      - fill: { into: "#q", text: "ousterhout" }
      - wait_for: "article.row:has(h4:text-is('ousterhout-software-design'))"
      - pause: 1.5
  - name: Open it to read the three prices apart
    do:
      - click: "article.row:has(h4:text-is('ousterhout-software-design')) .more"
      - wait_for: "article.row.open .detail dd:has-text('bundled file')"
      - pause: 3
