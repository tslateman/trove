<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trove</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbfaf8; --panel: #ffffff; --ink: #1a1815; --muted: #6b6560;
  --line: #e6e1d9; --accent: #b4541e; --accent-soft: #f5e9e1;
  --ok: #2f6b45; --ok-soft: #e5efe8; --warn: #8a6d1f; --warn-soft: #f7efd8;
  --shadow: 0 1px 2px rgba(26,24,21,.05), 0 4px 16px rgba(26,24,21,.04);
  --grid-dot: #e9e4dc;
  --sans: "IBM Plex Sans", ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    --bg: #14130f; --panel: #1c1a16; --ink: #ece7de; --muted: #918a80;
    --line: #2e2b25; --accent: #e08b52; --accent-soft: #2c211a;
    --ok: #7fb894; --ok-soft: #1c2a21; --warn: #d4b25e; --warn-soft: #2a2517;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.2);
    --grid-dot: #1f1d18;
  }
}
:root[data-theme=dark] {
  --bg: #14130f; --panel: #1c1a16; --ink: #ece7de; --muted: #918a80;
  --line: #2e2b25; --accent: #e08b52; --accent-soft: #2c211a;
  --ok: #7fb894; --ok-soft: #1c2a21; --warn: #d4b25e; --warn-soft: #2a2517;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.2);
  --grid-dot: #1f1d18;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; color: var(--ink); font: 15px/1.55 var(--sans);
  background: var(--bg) radial-gradient(var(--grid-dot) 1px, transparent 1px) 0 0 / 22px 22px;
  -webkit-font-smoothing: antialiased;
}
body.has-stack { padding-bottom: 240px; }
a { color: inherit; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

/* ---------- header ---------- */
header.site {
  position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 90%, transparent);
  backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
}
.bar { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; min-height: 58px; padding-top: 8px; padding-bottom: 8px; }
.brand { display: flex; align-items: baseline; gap: 9px; text-decoration: none; }
.brand b { font-size: 19px; letter-spacing: -.02em; }
.brand span { color: var(--muted); font: 12.5px/1 var(--mono); }
.nav { display: flex; gap: 2px; }
.nav a {
  text-decoration: none; color: var(--muted); font-size: 14px; font-weight: 500; padding: 7px 11px;
  border-radius: 8px; border-bottom: 2px solid transparent; border-radius: 8px 8px 0 0;
}
.nav a:hover { color: var(--ink); background: var(--panel); }
.nav a[aria-current=page] { color: var(--accent); border-bottom-color: var(--accent); }
.search { flex: 1 1 200px; min-width: 0; position: relative; max-width: 460px; margin-left: auto; }
.search input {
  width: 100%; padding: 8px 40px 8px 34px; border-radius: 9px; font: inherit; font-size: 14px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: .45; }
.kbd {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font: 11px/1 var(--mono);
  color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 4px 6px; pointer-events: none;
}
.iconbtn { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 8px;
  padding: 6px 9px; cursor: pointer; font-size: 13px; }
.iconbtn:hover { color: var(--ink); border-color: var(--accent); }

/* ---------- page head ---------- */
main.wrap { padding-top: 40px; padding-bottom: 60px; }
.crumbs { display: flex; gap: 8px; align-items: center; font: 12.5px/1 var(--mono); color: var(--muted); margin-bottom: 14px; }
.crumbs a { text-decoration: none; }
.crumbs a:hover { color: var(--accent); }
.crumbs b { color: var(--ink); font-weight: 500; }
.pagehead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 24px; margin-bottom: 22px; }
.pagehead h1 { margin: 0 0 4px; font-size: 30px; line-height: 1.1; letter-spacing: -.025em; font-weight: 600; }
.lede { margin: 0; color: var(--muted); font-size: 14.5px; max-width: 62ch; }
.lede b { color: var(--ink); font-weight: 500; font-family: var(--mono); font-size: 13.5px; }
.lede code { font: 13px/1 var(--mono); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; }

/* ---------- category tiles ---------- */
.tiles { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -2px 6px; scrollbar-width: thin; }
.tile {
  flex: 0 0 auto; min-width: 128px; text-align: left; display: flex; flex-direction: column; gap: 8px;
  padding: 12px 14px 11px; border: 1px solid var(--line); border-radius: 11px; background: var(--panel);
  cursor: pointer; box-shadow: var(--shadow); transition: border-color .12s, transform .12s;
}
.tile:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); transform: translateY(-1px); }
.tile b { font: 500 13.5px/1.2 var(--mono); letter-spacing: -.01em; }
.tile i { font: 12px/1 var(--mono); color: var(--muted); font-style: normal; }
.tile i::after { content: " skills"; }
.tile small { font: 10.5px/1 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tile[aria-pressed=true] { border-color: var(--accent); background: var(--accent-soft); }
.tile[aria-pressed=true] b, .tile[aria-pressed=true] i { color: var(--accent); }

/* ---------- toolbar ---------- */
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 10px 0 12px; }
.toolbar .group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.toolbar .label { font: 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); margin-right: 2px; }
.chip {
  border: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 5px 11px;
  border-radius: 999px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
}
.chip i { font: 11px/1 var(--mono); font-style: normal; opacity: .8; }
.chip:hover { color: var(--ink); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.chip[aria-pressed=true] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); font-weight: 500; }
.chip.warnish[aria-pressed=true] { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.chip.okish[aria-pressed=true] { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.showing { margin-left: auto; font: 12.5px/1 var(--mono); color: var(--muted); }
.showing button { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0 0 0 8px; font: inherit; }
.legend { margin: 0 0 12px; font-size: 12.5px; color: var(--muted); }
.legend b { color: var(--ok); font-weight: 600; }
.gloss { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; cursor: pointer; }
.gloss:hover { color: var(--accent); text-decoration-style: solid; }
a.plain { text-decoration: none; }
a.plain:hover .pill { border-color: var(--accent); color: var(--accent); }

/* ---------- install-state setup ---------- */
.setup { border: 1px solid var(--accent); border-radius: 12px; background: var(--panel);
  box-shadow: var(--shadow); padding: 15px 18px 17px; margin: 0 0 16px; }
.setup { position: relative; }
.setup h3 { margin: 0 0 5px; font-size: 15px; }
.setup .close { position: absolute; top: 10px; right: 12px; border: 0; background: none; color: var(--muted);
  font-size: 17px; line-height: 1; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
.setup .close:hover { color: var(--accent); background: var(--accent-soft); }
.setup .srclist { margin: 8px 0 0; padding-left: 19px; display: grid; gap: 3px; font-size: 13px; }
.setup .srclist code { color: var(--ink); }
.setup > p { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; max-width: 76ch; }
.setup code { font: 12.5px/1 var(--mono); color: var(--ink); }
.setup > p code { background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 2px 5px; }
.setup ol { margin: 0; padding-left: 19px; display: grid; gap: 11px; }
.setup li { font-size: 13.5px; color: var(--muted); min-width: 0; }
.setup .cmd { display: flex; align-items: stretch; margin-top: 5px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--bg); overflow: hidden; font: 12px/1.4 var(--mono); }
.setup .cmd code { flex: 1; min-width: 0; padding: 8px 10px; overflow-x: auto; white-space: pre; color: var(--ink); }
.setup .cmd.sh code::before { content: "$ "; color: var(--muted); }
.setup .cmd button { border: 0; border-left: 1px solid var(--line); background: var(--panel);
  color: var(--muted); padding: 0 10px; cursor: pointer; font: 12px/1 var(--mono); }
.setup .cmd button:hover { color: var(--accent); }

/* ---------- list ---------- */
.list { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow); overflow: hidden; }
.cols { grid-template-columns: 40px 34px minmax(0, 1fr) 112px 112px 140px 104px 36px; }
.listhead {
  display: grid; align-items: center; gap: 0 10px; padding: 0 6px 0 2px; border-bottom: 1px solid var(--line);
  background: color-mix(in srgb, var(--bg) 60%, var(--panel));
}
.listhead > * { font: 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 10px 6px; text-align: left; }
.listhead button { border: 0; background: none; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; white-space: nowrap; }
.listhead button:hover { color: var(--ink); }
.listhead button[aria-sort=ascending], .listhead button[aria-sort=descending] { color: var(--accent); font-weight: 600; }
.listhead button::after { content: "↕"; opacity: .35; }
.listhead button[aria-sort=ascending]::after { content: "↑"; opacity: 1; }
.listhead button[aria-sort=descending]::after { content: "↓"; opacity: 1; }
.listhead .num, .row .num { text-align: right; justify-content: flex-end; }
.row {
  display: grid; align-items: center; gap: 0 10px; padding: 0 6px 0 2px; border-bottom: 1px solid var(--line);
  cursor: pointer; transition: background .1s;
}
.row:last-child { border-bottom: 0; }
.row:hover { background: color-mix(in srgb, var(--accent-soft) 45%, var(--panel)); }
.row.picked { background: color-mix(in srgb, var(--accent-soft) 70%, var(--panel)); box-shadow: inset 3px 0 0 var(--accent); }
.row > * { padding: 11px 6px; min-width: 0; }
.pickcell { display: grid; place-items: center; cursor: pointer; }
.pick { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); cursor: pointer; }
.rank { font: 12px/1 var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.ident .line { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 9px; }
.ident h4 { margin: 0; font: 600 14.5px/1.3 var(--mono); letter-spacing: -.01em; }
.ident .src { font: 12px/1 var(--mono); color: var(--muted); }
.ident p { margin: 2px 0 0; font-size: 13px; color: var(--muted); line-height: 1.45;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.open .ident p { white-space: normal; }
.pill { font: 11px/1 var(--mono); padding: 4px 7px; border-radius: 6px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.cat { background: var(--accent-soft); border-color: transparent; color: var(--accent); cursor: pointer; }
.pill.cat:hover { text-decoration: underline; text-underline-offset: 3px; }
.pill.lint { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.pill.ver { font-weight: 600; color: var(--ink); }
.pill.ok { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.pill.off { border-style: dashed; }
.pill.upd { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.catcell { display: flex; }
.num { font: 13px/1 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.num.on { color: var(--ok); font-weight: 600; }
.num.dim { color: var(--muted); opacity: .6; }
.more { border: 0; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center; border-radius: 6px; }
.more:hover { color: var(--accent); background: var(--accent-soft); }
.more svg { transition: transform .15s; }
.row.open .more svg { transform: rotate(180deg); }
.detail {
  grid-column: 1 / -1; display: none; cursor: auto; padding: 0 12px 16px 76px;
  font-size: 13.5px; color: var(--muted); line-height: 1.5;
}
.row.open .detail { display: block; }
.detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 5px 16px; margin: 8px 0 0; }
.detail dt { font: 11px/1.6 var(--mono); text-transform: uppercase; letter-spacing: .08em; }
.detail dd { margin: 0; color: var(--ink); font: 13px/1.6 var(--mono); overflow-wrap: anywhere; }
.detail dd .pill { margin-right: 4px; }
.detail .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn {
  border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px;
  padding: 6px 12px; font-size: 13px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { color: #fff; filter: brightness(1.07); }
.empty { padding: 56px 0; text-align: center; color: var(--muted); }
.empty button { border: 0; background: none; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; padding: 0; }

/* plugins */
.pcols { grid-template-columns: minmax(0, 1fr) 120px minmax(300px, 460px); }
.row.plugin { cursor: auto; }
.row.plugin:hover { background: none; }
.row.plugin .ident p { white-space: normal; }
.row.plugin .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; align-items: center; }
.row.plugin .ident { padding: 16px 10px; }
.tolist { border: 0; background: none; color: var(--accent); cursor: pointer; font: 500 13.5px/1 var(--mono); text-align: left; white-space: nowrap; }
.tolist:hover { text-decoration: underline; text-underline-offset: 3px; }
.install { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); overflow: hidden; font: 12px/1.4 var(--mono); }
.install code { flex: 1; padding: 8px 10px; overflow-x: auto; white-space: nowrap; color: var(--ink); }
.install code::before { content: "$ "; color: var(--muted); }
.install button { border: 0; border-left: 1px solid var(--line); background: var(--panel); color: var(--muted); padding: 0 10px; cursor: pointer; font: 12px/1 var(--mono); }
.install button:hover { color: var(--accent); }

/* ---------- docs ---------- */
.docwrap { display: grid; grid-template-columns: 216px minmax(0, 1fr); gap: 20px; align-items: start; }
.docrail { position: sticky; top: 74px; display: grid; gap: 2px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--panel); box-shadow: var(--shadow); padding: 8px; }
.docrail a { display: block; padding: 7px 10px; border-radius: 8px; text-decoration: none; color: var(--muted); font-size: 13.5px; }
.docrail a:hover { color: var(--ink); background: var(--bg); }
.docrail a[aria-current=page] { color: var(--accent); background: var(--accent-soft); font-weight: 500; }
.docbody { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); box-shadow: var(--shadow);
  padding: 26px 32px 34px; min-width: 0; font-size: 14.5px; line-height: 1.65; }
.docbody :is(h1, h2, h3, h4) { scroll-margin-top: 80px; }
.docbody h1 { margin: 0 0 14px; font-size: 27px; letter-spacing: -.02em; }
.docbody h2 { margin: 30px 0 10px; font-size: 19px; padding-top: 14px; border-top: 1px solid var(--line); }
.docbody h3 { margin: 22px 0 6px; font: 600 15px/1.3 var(--mono); color: var(--accent); }
.docbody h4 { margin: 18px 0 6px; font-size: 14px; }
.docbody p, .docbody li { color: var(--muted); }
.docbody a { color: var(--accent); text-underline-offset: 3px; }
.docbody code { font: 12.5px/1.5 var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 5px; padding: 1px 3px; }
.docbody pre { margin: 12px 0; overflow-x: auto; background: var(--bg); border: 1px solid var(--line);
  border-radius: 9px; padding: 12px 14px; }
.docbody pre code { border: 0; background: none; padding: 0; font-size: 12.5px; line-height: 1.6; color: var(--ink); }
.docbody img { max-width: 100%; border: 1px solid var(--line); border-radius: 9px; margin: 10px 0; }
.docbody ul, .docbody ol { padding-left: 22px; display: grid; gap: 5px; }
.docbody blockquote { margin: 12px 0; padding: 2px 14px; border-left: 3px solid var(--line); color: var(--muted); }
.docbody hr { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
.docbody .tablewrap { overflow-x: auto; margin: 12px 0; }
.docbody table { border-collapse: collapse; font-size: 13.5px; }
.docbody th, .docbody td { border: 1px solid var(--line); padding: 7px 11px; text-align: left; vertical-align: top; }
.docbody th { background: var(--bg); font-weight: 600; white-space: nowrap; }
.docbody td code { white-space: nowrap; }
.docnote { color: var(--muted); }
.docstatus { float: right; margin: 2px 0 8px 16px; font: 11px/1 var(--mono); text-transform: uppercase;
  letter-spacing: .09em; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.docstatus.verified { border-color: var(--ok); color: var(--ok); background: var(--ok-soft); }
.docstatus::before { content: "○ "; }
.docstatus.verified::before { content: "✓ "; }

/* ---------- stack tray ---------- */
.stack {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: color-mix(in srgb, var(--panel) 94%, transparent); backdrop-filter: blur(12px);
  border-top: 2px solid var(--accent); box-shadow: 0 -8px 32px rgba(0,0,0,.12);
}
.stack.hidden { display: none; }
.stack .wrap { display: grid; grid-template-columns: 200px minmax(0, 1fr) auto; gap: 16px; align-items: start; padding-top: 14px; padding-bottom: 14px; }
.stack .pane { min-width: 0; }
.stack .next { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stack .next > span:first-child { white-space: nowrap; }
.stack .next > span:first-child code { font: 12px/1.5 var(--mono); color: var(--ink); }
.stack .next .install { flex: 1 1 320px; min-width: 0; }
.stack .sum b { display: block; font-size: 14px; }
.stack .sum span { font: 12.5px/1.5 var(--mono); color: var(--muted); }
.stack .sum span em { font-style: normal; color: var(--ok); font-weight: 600; }
.stack pre {
  margin: 0; max-height: 132px; overflow: auto; background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 11px; font: 11.5px/1.5 var(--mono); white-space: pre;
}
.stack .acts { display: flex; flex-direction: column; gap: 6px; min-width: 150px; }
.stack .acts .btn { justify-content: center; }
.stack .acts .btn[aria-pressed=true] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

/* ---------- atlas ---------- */
.atlasnote { font: 12.5px/1.5 var(--mono); color: var(--muted); margin: 0 0 12px; }
.duo { display: grid; grid-template-columns: 1.5fr 1fr; gap: 14px; align-items: stretch; }
.mapbox { position: relative; border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
  box-shadow: var(--shadow); overflow: hidden; }
.mapbox svg { display: block; width: 100%; height: 66vh; min-height: 460px; max-height: 720px; cursor: grab; }
.mapbox svg.panning { cursor: grabbing; }
.map-edge { stroke: var(--line); fill: none; stroke-width: 1; }
.map-spoke { stroke: var(--line); stroke-width: 1; }
.leaf circle { fill: var(--muted); }
.leaf.flagged circle { fill: var(--warn); }
.leaf text { font: 12px/1 var(--mono); fill: var(--muted); cursor: pointer; }
.leaf:hover text, .leaf.sel text { fill: var(--accent); }
.leaf.sel circle { fill: var(--accent); }
.cnode text { font: 700 14px/1 var(--mono); letter-spacing: .08em; fill: var(--ink); cursor: pointer;
  paint-order: stroke; stroke: var(--panel); stroke-width: 6px; stroke-linejoin: round; }
.cnode .cnt { font-weight: 400; fill: var(--muted); letter-spacing: 0; }
.cnode rect { fill: var(--muted); }
.cnode:hover text { fill: var(--accent); }
.root-label { font: 700 17px/1 var(--mono); letter-spacing: .14em; fill: var(--accent); }
.root-count { font: 12px/1 var(--mono); fill: var(--muted); }
.leaf, .cw { transition: opacity .15s ease; }
.tooltip { position: absolute; pointer-events: none; z-index: 5; background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; box-shadow: var(--shadow); padding: 8px 11px; max-width: 300px; font-size: 12.5px; display: none; }
.tooltip .tn { font: 700 12px/1 var(--mono); color: var(--accent); }
.tooltip .to { font: 10px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 3px 0 4px; }
.tooltip .th { color: var(--muted); line-height: 1.45; }
.tooltip .tt { color: var(--ok); font: 11px/1 var(--mono); margin-top: 4px; }
.cloudbox { position: relative; border: 1px solid var(--line); border-radius: 12px; background: var(--panel);
  box-shadow: var(--shadow); height: 460px; overflow: hidden; }
.cw { position: absolute; font-weight: 600; color: var(--muted); background: none; border: none; padding: 0;
  cursor: pointer; line-height: 1; white-space: nowrap; }
.cw.big { color: var(--ink); font-weight: 700; }
.cw:hover { color: var(--accent); }
.cw.active { color: var(--accent); text-decoration: underline; text-underline-offset: 4px; }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .duo { grid-template-columns: 1fr; }
  .docwrap { grid-template-columns: 1fr; }
  .docrail { position: static; grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; }
  .docbody { padding: 20px 18px 26px; }
}
@media (max-width: 760px) {
  .wrap { padding: 0 16px; }
  .bar { gap: 8px 12px; }
  .brand { order: 0; }
  #add { order: 1; margin-left: auto; }
  #theme { order: 2; }
  .search { order: 2; flex-basis: 100%; max-width: none; margin-left: 0; }
  .nav { order: 3; width: 100%; }
  .pagehead h1 { font-size: 26px; }
  .listhead { display: none; }
  .cols { grid-template-columns: 36px minmax(0, 1fr) 32px; }
  .rank { display: none; }
  .row .costs { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px 12px; padding-top: 0; }
  .row .costs .num::before { content: attr(data-label) " "; color: var(--muted); font-weight: 400; }
  .row .costs .num { text-align: left; }
  .row .costs .num.dim { display: none; }
  .detail { padding-left: 12px; }
  .pcols { grid-template-columns: minmax(0, 1fr); }
  .row.plugin > * { padding-top: 6px; padding-bottom: 6px; }
  .row.plugin .ident { padding: 14px 10px 4px; }
  .row.plugin .install { margin-bottom: 8px; }
  .stack .wrap { grid-template-columns: 1fr; gap: 10px; }
  .stack .wrap { padding-top: 10px; padding-bottom: 10px; }
  .stack pre { max-height: 72px; }
  .stack .acts { flex-direction: row; flex-wrap: wrap; min-width: 0; }
  .stack .acts .btn { flex: 1 1 auto; white-space: nowrap; font-size: 12.5px; padding: 6px 10px; }
  body.has-stack { padding-bottom: 300px; }
}
@media (min-width: 761px) { .row .costs { display: contents; } }
@media (prefers-reduced-motion: reduce) { .leaf, .cw, .tile, .more svg, .row { transition: none; } }
</style>
</head>
<body>
<header class="site">
  <div class="wrap bar">
    <a class="brand" href="./"><b>Trove</b><span id="regname"></span></a>
    <nav class="nav" aria-label="Sections">
      <a id="t-skills" href="./" aria-current="page">Skills</a>
      <a id="t-plugins" href="./?view=plugins" aria-current="false">Plugins</a>
      <a id="t-atlas" href="./?view=atlas" aria-current="false">Atlas</a>
      <a id="t-docs" href="./?view=docs" aria-current="false" hidden>Docs</a>
    </nav>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search skills, descriptions, tags" autocomplete="off" aria-label="Search">
      <span class="kbd">/</span>
    </div>
    <button class="iconbtn" id="add" title="How a skill gets into this registry">+ Add a skill</button>
    <button class="iconbtn" id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </div>
</header>

<main class="wrap">
  <section id="view-skills">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="./" id="crumb-reg"></a><span>/</span><b>Skills</b></nav>
    <div class="pagehead">
      <div>
        <h1>Skills</h1>
        <p class="lede" id="tagline"></p>
        <p class="lede" id="totals"></p>
      </div>
    </div>
    <div class="tiles" id="f-cat" role="group" aria-label="Category"></div>
    <div class="toolbar">
      <div class="group" id="f-plug" role="group" aria-label="Plugin"></div>
      <div class="group" id="f-flag" role="group" aria-label="Flags"></div>
      <span class="showing" id="showing"></span>
    </div>
    <div id="slot-skills"></div>
    <p class="legend" id="legend"></p>
    <div class="list">
      <div class="listhead cols" role="row" id="listhead">
        <span></span><span>#</span>
        <button data-sort="name">Skill</button>
        <button data-sort="category">Category</button>
        <button data-sort="on" class="num" title="Name and description, in the prompt every session whether or not the skill fires">Always-on</button>
        <button data-sort="fire" class="num" title="The SKILL.md body, read only when the skill fires">When it fires</button>
        <button data-sort="files" class="num" title="Files beside SKILL.md, each read only if the body sends the skill to it">Bundled</button>
        <span></span>
      </div>
      <div id="grid" role="list"></div>
      <div class="empty" id="empty" hidden>Nothing matches. <button id="reset">Clear the filters</button></div>
    </div>
  </section>

  <section id="view-plugins" hidden>
    <nav class="crumbs" aria-label="Breadcrumb"><a href="./" id="crumb-reg-p"></a><span>/</span><b>Plugins</b></nav>
    <div class="pagehead">
      <div>
        <h1>Plugins</h1>
        <p class="lede" id="ptotals"></p>
      </div>
    </div>
    <div id="slot-plugins"></div>
    <div class="list">
      <div id="pgrid" role="list"></div>
      <div class="empty" id="pempty" hidden>No plugin matches.</div>
    </div>
  </section>

  <section id="view-atlas" class="atlas" hidden>
    <nav class="crumbs" aria-label="Breadcrumb"><a href="./" id="crumb-reg-a"></a><span>/</span><b>Atlas</b></nav>
    <div class="pagehead">
      <div>
        <h1>Atlas</h1>
        <p class="lede" id="atotals"></p>
      </div>
    </div>
    <div id="slot-atlas"></div>
    <p class="atlasnote">Drag to pan, scroll to zoom, click a branch to fold it, click a skill to
      pick it. Search, filters, and picks stay in sync with Skills.</p>
    <div class="duo" id="atlas">
      <div class="mapbox" id="mapbox"><div class="tooltip" id="tooltip"></div></div>
      <div class="cloudbox" id="cloudbox"></div>
    </div>
  </section>
  <section id="view-docs" hidden>
    <nav class="crumbs" aria-label="Breadcrumb"><a href="./" id="crumb-reg-d"></a><span>/</span><b>Docs</b><span>/</span><b id="crumb-doc"></b></nav>
    <div class="docwrap">
      <nav class="docrail" id="doclist" aria-label="Pages"></nav>
      <article class="docbody" id="docbody"></article>
    </div>
  </section>
</main>

<div class="stack hidden" id="stack" aria-live="polite">
  <div class="wrap">
    <div class="sum"><b>Your stack</b><span id="stackcount"></span></div>
    <div class="pane">
      <pre id="snippet"></pre>
      <p class="next" id="next"></p>
    </div>
    <div class="acts">
      <button id="copy" class="btn primary">Copy bundle</button>
      <button id="showpicked" class="btn" aria-pressed="false">Show picked only</button>
      <button id="clear" class="btn">Clear</button>
    </div>
  </div>
</div>

<script>
const VIEWS = ["skills", "plugins", "atlas", "docs"];
const SORTS = { category: s => s.category, on: s => s.tokensAlwaysOn, fire: s => s.tokensOnInvoke, files: s => s.tokensBundledMax };
const RAW_GITHUB = "https://raw.githubusercontent.com/";
const FLAGS = ["lint", "picked", "twins", "installed", "absent"];
const state = { data: null, machine: null, docs: [], page: "", panel: "", q: "", cat: null, plug: null,
  flag: null, anchor: "", view: "skills", sort: { key: "name", dir: 1 }, picked: new Set(), open: new Set(), twins: new Set() };
const $ = (id) => document.getElementById(id);
// Two sources can ship the same skill name, so a pick is keyed by both.
const skillKey = (s) => s.source + ":" + s.path;
const k = (n) => (n / 1000).toFixed(1) + "k";

// The catalog is what the registry offers. `installed.json` is what this
// machine has, and only `trove serve` answers for it: a published build has no
// endpoint, so the page falls back to explaining how to get one.
Promise.all([
  fetch("catalog.json").then(r => r.json()),
  fetch("installed.json").then(r => (r.ok ? r.json() : null)).catch(() => null),
  // The guides a build ships, in reading order. A build without them hides the tab.
  fetch("docs/index.json").then(r => (r.ok ? r.json() : [])).catch(() => []),
]).then(([catalog, machine, docs]) => {
  state.data = catalog;
  state.machine = machine;
  state.docs = docs || [];
  boot();
});

function boot() {
  applyTheme(stored(localStorage, "theme"));
  // A machine that installed these plugins under another name is a finding,
  // so the steps that fix the reading open by themselves.
  state.panel = state.machine && state.machine.suggest ? "installed" : "";
  readUrl();
  for (const key of stored(sessionStorage, "picked") || []) state.picked.add(key);
  const d = state.data;
  $("regname").textContent = d.registry;
  for (const id of ["crumb-reg", "crumb-reg-p", "crumb-reg-a", "crumb-reg-d"]) $(id).textContent = d.registry;
  $("t-docs").hidden = state.docs.length === 0;
  const nSources = Object.keys(d.sources).length;
  $("tagline").innerHTML = [
    escapeHtml(d.description || ""),
    docFile("README.md") ? docLink("What is Trove?", "README.md") : "",
  ].filter(Boolean).join(" · ");
  $("totals").innerHTML = `<b>${d.totals.skills}</b> skills from <b>${nSources}</b> source${nSources === 1 ? "" : "s"}` +
    ` · <b>${d.totals.alwaysOn.toLocaleString()}</b> tokens always-on if you install them all.` +
    (hasInstalls() ? ` <b>${installedSkills().length}</b> of them are installed here, ` +
      `<b>${enabledSkills().length}</b> enabled at <b>${liveCost().toLocaleString()}</b> tokens today.` : "");
  $("ptotals").innerHTML = `<b>${d.plugins.length}</b> plugin${d.plugins.length === 1 ? "" : "s"} composed from ` +
    `<b>${nSources}</b> source${nSources === 1 ? "" : "s"}. Each row carries its install command.` +
    (hasInstalls() ? ` <b>${state.machine.totals.plugins}</b> installed on this machine, ` +
      `<b>${state.machine.totals.enabled}</b> of those enabled.` : "");

  $("q").addEventListener("input", e => { state.q = e.target.value.toLowerCase(); writeUrl(); render(); });
  for (const v of VIEWS) $("t-" + v).addEventListener("click", e => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
    e.preventDefault();
    setView(v);
  });
  $("listhead").addEventListener("click", e => {
    const b = e.target.closest("button[data-sort]");
    if (!b) return;
    const key = b.dataset.sort;
    state.sort = state.sort.key === key ? { key, dir: -state.sort.dir } : { key, dir: key === "name" || key === "category" ? 1 : -1 };
    writeUrl(); render();
  });
  $("reset").onclick = () => { state.cat = state.plug = state.flag = null; state.q = ""; $("q").value = ""; writeUrl(); render(); };
  $("clear").onclick = () => { state.picked.clear(); if (state.flag === "picked") state.flag = null; persistPicks(); writeUrl(); render(); };
  $("showpicked").onclick = () => { state.flag = state.flag === "picked" ? null : "picked"; if (state.view === "plugins") state.view = "skills"; writeUrl(true); render(); };
  $("copy").onclick = () => copyText($("snippet").textContent, $("copy"), "Copy bundle");
  $("theme").onclick = toggleTheme;
  $("add").onclick = () => openDoc("sharing-a-skill.md");
  $("add").hidden = !docFile("sharing-a-skill.md");
  addEventListener("keydown", e => {
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName);
    if ((e.metaKey || e.ctrlKey) && e.key === "k") { e.preventDefault(); $("q").focus(); $("q").select(); }
    else if (e.key === "/" && !typing) { e.preventDefault(); $("q").focus(); $("q").select(); }
    else if (e.key === "Escape") { $("q").blur(); }
  });
  addEventListener("popstate", () => { readUrl(); render(); });
  document.addEventListener("click", e => {
    const link = e.target.closest("a[data-doc]");
    if (!link || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
    e.preventDefault();
    openDoc(link.dataset.doc);
  });
  render();
}

/* ---------- persistence ---------- */
// Reading storage throws when a browser blocks site data, and the page must
// still render with nothing remembered.
function stored(box, key) {
  try { const v = box.getItem("trove:" + key); return v ? JSON.parse(v) : null; } catch (err) { return null; }
}
function store(box, key, value) {
  try { box.setItem("trove:" + key, JSON.stringify(value)); } catch (err) {}
}
// Picks live with the tab: a reload keeps the stack, a new tab starts clean.
function persistPicks() { store(sessionStorage, "picked", [...state.picked]); }

function applyTheme(theme) {
  if (theme === "dark" || theme === "light") document.documentElement.setAttribute("data-theme", theme);
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute("data-theme");
  const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  const next = dark ? "light" : "dark";
  applyTheme(next);
  store(localStorage, "theme", next);
}

function readUrl() {
  const p = new URLSearchParams(location.search);
  state.view = VIEWS.includes(p.get("view")) ? p.get("view") : "skills";
  $("q").value = p.get("q") || "";
  state.q = $("q").value.toLowerCase();
  state.page = docFile(p.get("page")) || (state.docs[0] || {}).file || "";
  state.anchor = location.hash.slice(1);
  state.cat = p.get("cat");
  state.plug = p.get("plugin");
  state.flag = FLAGS.includes(p.get("flag")) ? p.get("flag") : null;
  if (!hasInstalls() && (state.flag === "installed" || state.flag === "absent")) state.flag = null;
  const [key, dir] = (p.get("sort") || "name").split(":");
  state.sort = key === "name" || SORTS[key] ? { key, dir: dir === "desc" ? -1 : 1 } : { key: "name", dir: 1 };
}
function writeUrl(push) {
  const p = new URLSearchParams();
  if (state.view !== "skills") p.set("view", state.view);
  if (state.view === "docs" && state.page) p.set("page", state.page);
  if ($("q").value) p.set("q", $("q").value);
  if (state.cat) p.set("cat", state.cat);
  if (state.plug) p.set("plugin", state.plug);
  if (state.flag) p.set("flag", state.flag);
  if (!(state.sort.key === "name" && state.sort.dir === 1)) p.set("sort", state.sort.key + (state.sort.dir < 0 ? ":desc" : ""));
  const url = location.pathname + (p.toString() ? "?" + p : "") + (state.view === "docs" && state.anchor ? "#" + state.anchor : "");
  history[push ? "pushState" : "replaceState"](null, "", url);
}

function togglePanel(kind) {
  state.panel = state.panel === kind ? "" : kind;
  render();
}

function setView(v) {
  state.view = v;
  writeUrl(true);
  render();
  scrollTo({ top: 0 });
}

function togglePick(key) {
  state.picked.has(key) ? state.picked.delete(key) : state.picked.add(key);
  if (!state.picked.size && state.flag === "picked") { state.flag = null; writeUrl(); }
  persistPicks();
  render();
}

/* ---------- what this machine has ---------- */
// `plugins` carries only what is installed, so a name missing from it is a
// name this machine does not have.
function machinePlugins() {
  return state.machine && state.machine.available ? state.machine.plugins : null;
}
function hasInstalls() {
  const p = machinePlugins();
  return Boolean(p && Object.keys(p).length);
}
function marketplaceName() {
  return (state.machine && state.machine.marketplace) || state.data.marketplace || state.data.registry;
}
// A skill arrives through its plugins: installed when any of them is, and
// charged only when one of those is also enabled.
function skillMachine(s) {
  const all = machinePlugins();
  if (!all) return null;
  const owners = s.plugins.map(n => all[n]).filter(Boolean);
  return { installed: owners.length > 0, enabled: owners.some(o => o.enabled) };
}
function installedSkills() { return state.data.skills.filter(s => skillMachine(s).installed); }
function enabledSkills() { return state.data.skills.filter(s => skillMachine(s).enabled); }
function liveCost() {
  return state.data.skills.reduce((n, s) => n + (skillMachine(s).enabled ? s.tokensAlwaysOn : 0), 0);
}

/* ---------- filtering ---------- */
function matches(s) {
  if (state.cat && s.category !== state.cat) return false;
  if (state.plug && !s.plugins.includes(state.plug)) return false;
  if (state.flag === "lint" && !s.lint.length) return false;
  if (state.flag === "twins" && !state.twins.has(s.name)) return false;
  if (state.flag === "installed" && !skillMachine(s).installed) return false;
  if (state.flag === "absent" && skillMachine(s).installed) return false;
  if (state.flag === "picked" && !state.picked.has(skillKey(s))) return false;
  if (!state.q) return true;
  return (s.name + " " + s.description + " " + (s.tags || []).join(" ")).toLowerCase().includes(state.q);
}
// Plugins carry no category, plugin, or lint of their own to filter by, so
// only the shared search box narrows them.
function matchesPlugin(p) {
  if (!state.q) return true;
  return (p.name + " " + (p.description || "") + " " + (p.tags || []).join(" ")).toLowerCase().includes(state.q);
}

function sortSkills(list) {
  const { key, dir } = state.sort;
  const idx = new Map(state.data.skills.map((s, i) => [s, i]));
  const val = SORTS[key];
  return [...list].sort((a, b) => {
    let c = 0;
    if (val) {
      const va = val(a), vb = val(b);
      c = typeof va === "number" ? va - vb : String(va).localeCompare(String(vb));
    }
    if (c === 0) c = idx.get(a) - idx.get(b);
    return c * dir;
  });
}

/* ---------- rendering ---------- */
// A name that more than one source ships. The stack keys picks by source, so
// twins never collide there; the filter exists so the overlap is visible.
function twinNames(skills) {
  const sources = new Map();
  for (const s of skills) (sources.get(s.name) || sources.set(s.name, new Set()).get(s.name)).add(s.source);
  return new Set([...sources].filter(([, srcs]) => srcs.size > 1).map(([name]) => name));
}

function render() {
  const skills = state.data.skills;
  state.twins = twinNames(skills);
  document.body.classList.toggle("has-stack", state.picked.size > 0);
  for (const v of VIEWS) {
    $("t-" + v).setAttribute("aria-current", v === state.view ? "page" : "false");
    $("view-" + v).hidden = v !== state.view;
  }
  renderPanel();
  if (state.view === "docs") {
    $("grid").innerHTML = "";
    $("pgrid").innerHTML = "";
    renderDocs();
  } else if (state.view === "plugins") {
    $("grid").innerHTML = "";
    renderPlugins();
  } else {
    $("pgrid").innerHTML = "";
    renderFacets(skills);
    const shown = sortSkills(skills.filter(matches));
    if (state.view === "atlas") renderAtlasView(shown, skills.length);
    else renderList(shown, skills.length);
  }
  renderStack();
}

function renderFacets(skills) {
  const tally = (fn) => {
    const m = new Map();
    for (const s of skills) for (const v of [].concat(fn(s))) m.set(v, (m.get(v) || 0) + 1);
    return [...m].sort((a, b) => b[1] - a[1]);
  };
  // A category is a fallback (repo name standing in for a real topic) only
  // when every skill wearing that label is one — a genuine category can
  // coincidentally share a name with a fallback from another source.
  const catFallback = new Map();
  for (const s of skills) catFallback.set(s.category, (catFallback.get(s.category) ?? true) && s.categoryIsFallback);

  const tiles = $("f-cat");
  tiles.innerHTML = "";
  tiles.appendChild(tile("All skills", skills.length, state.cat === null, false, () => { state.cat = null; }));
  for (const [label, count] of tally(s => s.category)) {
    tiles.appendChild(tile(label, count, state.cat === label, catFallback.get(label),
      () => { state.cat = state.cat === label ? null : label; }));
  }

  const plugs = $("f-plug");
  plugs.innerHTML = '<span class="label">Plugin</span>';
  plugs.appendChild(chip("Any", null, state.plug === null, () => { state.plug = null; }));
  for (const [label, count] of tally(s => s.plugins)) {
    plugs.appendChild(chip(label, count, state.plug === label, () => { state.plug = state.plug === label ? null : label; }));
  }

  const flags = $("f-flag");
  flags.innerHTML = '<span class="label">Show</span>';
  const lintChip = chip("Flagged by lint", skills.filter(s => s.lint.length).length, state.flag === "lint",
    () => { state.flag = state.flag === "lint" ? null : "lint"; });
  lintChip.classList.add("warnish");
  lintChip.title = "Skills whose frontmatter would stop Claude Code from choosing or reading them as written; each row names the failed check";
  flags.appendChild(lintChip);
  if (hasInstalls()) {
    const here = skills.filter(s => skillMachine(s).installed).length;
    const mine = chip("Installed", here, state.flag === "installed",
      () => { state.flag = state.flag === "installed" ? null : "installed"; });
    mine.classList.add("okish");
    mine.title = `Shipped by a plugin installed from marketplace ${marketplaceName()}`;
    flags.appendChild(mine);
    const rest = chip("Not installed", skills.length - here, state.flag === "absent",
      () => { state.flag = state.flag === "absent" ? null : "absent"; });
    rest.title = "Offered by the registry, but no plugin on this machine ships it";
    flags.appendChild(rest);
  } else {
    const ask = chip("Installed?", null, state.panel === "installed", () => { state.panel = state.panel === "installed" ? "" : "installed"; });
    ask.title = "This page has no install state. Open the steps that give it one";
    flags.appendChild(ask);
  }
  if (state.twins.size) {
    const twinChip = chip("Shipped twice", skills.filter(s => state.twins.has(s.name)).length, state.flag === "twins",
      () => { state.flag = state.flag === "twins" ? null : "twins"; });
    twinChip.title = "A skill name that more than one source ships; the row's source label tells them apart";
    flags.appendChild(twinChip);
  }
}

// What to do when the page cannot tell installed from offered. Each branch
// names the specific reason, so the steps fit the machine reading them.
function setupSteps() {
  const m = state.machine;
  const mkt = escapeHtml(marketplaceName());
  if (!m) {
    return {
      title: "This page cannot see your machine",
      note: "Trove reads installed plugins from <code>claude plugin list</code>, and only the " +
        "local preview server answers for it. A published build never carries install state.",
      steps: [{ text: "Serve the catalog from the checkout, then reload:", cmd: "just serve", sh: true }],
    };
  }
  if (!m.available) {
    return {
      title: "Trove could not ask what is installed",
      note: `The preview server ran <code>claude plugin list --json</code> and got: ` +
        `${escapeHtml(m.reason || "no answer")}.`,
      steps: [{ text: "Run it yourself to see the failure:", cmd: "claude plugin list --json", sh: true }],
    };
  }
  if (m.suggest) {
    const other = escapeHtml(m.suggest.marketplace);
    return {
      title: "These plugins are installed under another name",
      note: `Nothing is installed from ${docLink("marketplace", "glossary.md#marketplace")} ` +
        `<code>${mkt}</code>, but this machine has <b>${m.suggest.matches}</b> of these plugins ` +
        `under <code>${other}</code>. Trove joins on that name, so name the one your teammates added.`,
      steps: [
        { text: "Record it in the bundle, then rebuild:", cmd: `marketplace: ${m.suggest.marketplace}` },
        { text: "Or name it for one run:", cmd: `trove serve --marketplace ${m.suggest.marketplace}`, sh: true },
      ],
    };
  }
  const first = (state.data.plugins[0] || {}).name || "<plugin>";
  const steps = [];
  if (!m.configured) {
    steps.push({
      text: m.add ? "Add this build as a marketplace:" : "Add this registry the way its README names it:",
      cmd: `claude plugin marketplace add ${m.add || "<owner/repo or URL>"}`,
      sh: true,
    });
  }
  steps.push({ text: "Install a plugin from it:", cmd: `claude plugin install ${first}@${marketplaceName()}`, sh: true });
  steps.push({ text: "Reload this page. Installed skills gain a filter, a badge, and a running cost." });
  return {
    title: `Nothing from ${mkt} is installed here`,
    note: `This machine runs Claude Code, and <code>claude plugin list</code> reports no plugin ` +
      `from marketplace <code>${mkt}</code>.`,
    steps,
  };
}

function renderPanel() {
  const slot = $("slot-" + state.view) || null;
  for (const id of ["slot-skills", "slot-plugins", "slot-atlas"]) $(id).innerHTML = "";
  if (state.panel === "installed" && hasInstalls()) state.panel = "";
  if (!slot || !state.panel) return;
  const plan = setupSteps();
  slot.innerHTML = `<section class="setup">
    <button type="button" class="close" aria-label="Close">×</button>
    <h3>${escapeHtml(plan.title)}</h3>
    <p>${plan.note}</p>
    <ol>${plan.steps.map(step => `<li>${step.html || escapeHtml(step.text)}` +
      (step.cmd ? `<div class="cmd${step.sh ? " sh" : ""}"><code>${escapeHtml(step.cmd)}</code>` +
        "<button type=\"button\">Copy</button></div>" : "") + "</li>").join("")}</ol>
  </section>`;
  slot.querySelector(".close").onclick = () => togglePanel(state.panel);
  for (const cmd of slot.querySelectorAll(".cmd")) {
    const button = cmd.querySelector("button");
    button.onclick = () => copyText(cmd.querySelector("code").textContent, button, "Copy");
  }
}

function tile(label, count, pressed, fallback, apply) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "tile" + (fallback ? " fallback" : "");
  b.setAttribute("aria-pressed", pressed);
  b.innerHTML = `<b>${escapeHtml(label)}</b><i>${count}</i>${fallback ? "<small>source</small>" : ""}`;
  if (fallback) b.title = "Derived from the repo name — not a curated category";
  b.onclick = () => { apply(); writeUrl(); render(); };
  return b;
}

function chip(label, count, pressed, apply) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "chip";
  b.setAttribute("aria-pressed", pressed);
  b.innerHTML = `${escapeHtml(label)}${count === null ? "" : `<i>${count}</i>`}`;
  b.onclick = () => { apply(); writeUrl(); render(); };
  return b;
}

function renderLegend() {
  $("legend").innerHTML =
    `Only <b>${docLink("always-on", "glossary.md#always-on")}</b> is charged every session. A body loads ` +
    `${docLink("when the skill fires", "glossary.md#when-it-fires")}, and a ` +
    `${docLink("bundled file", "glossary.md#bundled-files")} only if the body sends it there.`;
}

function renderList(shown, total) {
  renderLegend();
  for (const b of $("listhead").querySelectorAll("button[data-sort]")) {
    b.setAttribute("aria-sort", b.dataset.sort === state.sort.key ? (state.sort.dir > 0 ? "ascending" : "descending") : "none");
  }
  const filtered = Boolean(state.q || state.cat || state.plug || state.flag);
  $("showing").innerHTML = `${shown.length} of ${total}` +
    (filtered ? '<button type="button" id="showing-reset">clear</button>' : "");
  if (filtered) $("showing-reset").onclick = $("reset").onclick;
  $("empty").hidden = shown.length > 0;
  $("listhead").hidden = shown.length === 0;

  const grid = $("grid");
  grid.innerHTML = "";
  shown.forEach((s, i) => grid.appendChild(skillRow(s, i + 1)));
}

function skillRow(s, rank) {
  const key = skillKey(s);
  const picked = state.picked.has(key);
  const row = document.createElement("article");
  row.className = "row cols" + (picked ? " picked" : "") + (state.open.has(key) ? " open" : "");
  row.setAttribute("role", "listitem");
  row.dataset.key = key;
  const link = bodyLink(s);
  const mine = skillMachine(s);
  row.innerHTML = `
    <label class="pickcell"><input type="checkbox" class="pick" aria-label="Pick ${escapeHtml(s.name)}"${picked ? " checked" : ""}></label>
    <span class="rank">${rank}</span>
    <div class="ident">
      <div class="line">
        <h4>${escapeHtml(s.name)}</h4>
        <span class="src">${escapeHtml(s.source)}</span>
        ${mine && mine.installed ? installedPill(mine) : ""}
        ${s.lint.map(lintPill).join("")}
      </div>
      <p>${escapeHtml(s.description || "")}</p>
    </div>
    <div class="costs">
      <div class="catcell"><button type="button" class="pill cat" title="Show only ${escapeHtml(s.category)}">${escapeHtml(s.category)}</button></div>
      <span class="num on" data-label="always-on">+${s.tokensAlwaysOn}</span>
      <span class="num" data-label="when it fires">${k(s.tokensOnInvoke)}</span>
      ${s.bundledFiles
        ? `<span class="num" data-label="bundled" title="${s.bundledFiles} file${s.bundledFiles === 1 ? "" : "s"} beside SKILL.md, each read only if the body sends the skill to it">${s.bundledFiles} · ≤${k(s.tokensBundledMax)}</span>`
        : '<span class="num dim" data-label="bundled">—</span>'}
    </div>
    <button type="button" class="more" aria-expanded="${state.open.has(key)}" aria-label="Details for ${escapeHtml(s.name)}">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="detail">
      <dl>
        <dt>Path</dt><dd>${escapeHtml(s.source)} / ${escapeHtml(s.path)}</dd>
        <dt>Shipped by</dt><dd>${s.plugins.length ? s.plugins.map(p => `<span class="pill">${escapeHtml(p)}</span>`).join("") : "no plugin"}</dd>
        ${hasInstalls() ? `<dt>On this machine</dt><dd>${s.plugins.map(pluginStatePill).join("")}</dd>` : ""}
        ${(s.tags || []).length ? `<dt>Tags</dt><dd>${s.tags.map(t => `<span class="pill">${escapeHtml(t)}</span>`).join("")}</dd>` : ""}
        ${s.lint.length ? `<dt>Lint</dt><dd>${s.lint.map(c => `<span class="pill lint">${escapeHtml(c)}</span>`).join("")}</dd>` : ""}
        <dt>Cost</dt><dd>+${s.tokensAlwaysOn} tokens every session · ${s.tokensOnInvoke.toLocaleString()} when it fires${s.bundledFiles ? ` · up to ${s.tokensBundledMax.toLocaleString()} across ${s.bundledFiles} bundled file${s.bundledFiles === 1 ? "" : "s"}` : ""}</dd>
      </dl>
      <div class="acts">
        <button type="button" class="btn pickbtn">${picked ? "Remove from stack" : "Add to stack"}</button>
        ${link ? `<a class="btn" href="${escapeHtml(link)}" target="_blank" rel="noopener">Open SKILL.md ↗</a>` : ""}
      </div>
    </div>`;
  row.querySelector(".pick").addEventListener("change", () => togglePick(key));
  row.querySelector(".pickbtn").onclick = () => togglePick(key);
  row.querySelector(".pill.cat").onclick = () => { state.cat = s.category; writeUrl(); render(); };
  row.addEventListener("click", e => {
    if (e.target.closest("a, button, input, label, .detail, pre")) return;
    if (getSelection().toString()) return;
    toggleOpen(key);
  });
  row.querySelector(".more").onclick = () => toggleOpen(key);
  return row;
}

// Each finding has a fix, and the fix has a heading in the troubleshooting page.
function lintPill(code) {
  const pill = `<span class="pill lint">${escapeHtml(code)}</span>`;
  if (!docFile("troubleshooting.md")) return pill;
  const target = `troubleshooting.md#a-skill-is-flagged-${encodeURIComponent(code)}`;
  return `<a class="plain" href="./?view=docs&page=${escapeHtml(target)}" data-doc="${escapeHtml(target)}"` +
    ` title="What the ${escapeHtml(code)} finding means, and the fix">${pill}</a>`;
}

function installedPill(mine) {
  return mine.enabled
    ? '<span class="pill ok" title="A plugin on this machine ships this skill, and it is enabled">installed</span>'
    : '<span class="pill off" title="Installed, but every plugin that ships it is disabled, so Claude Code does not load it">disabled</span>';
}

function pluginStatePill(name) {
  const record = machinePlugins()[name];
  const label = !record ? "not installed" : record.enabled ? "enabled" : "installed, disabled";
  const version = record && record.version ? ` v${record.version}` : "";
  return `<span class="pill ${!record ? "off" : record.enabled ? "ok" : ""}">` +
    `${escapeHtml(name + version)} · ${label}</span>`;
}

function toggleOpen(key) {
  state.open.has(key) ? state.open.delete(key) : state.open.add(key);
  const row = document.querySelector(`.row[data-key="${CSS.escape(key)}"]`);
  if (!row) return;
  row.classList.toggle("open", state.open.has(key));
  row.querySelector(".more").setAttribute("aria-expanded", state.open.has(key));
}

function bodyLink(s) {
  // A source with neither a public pin nor a local checkout has nowhere to
  // resolve a body from, and the catalog omits `body` for it.
  const src = state.data.sources[s.source];
  if (!src || !src.body) return null;
  const base = src.body.startsWith(RAW_GITHUB)
    ? src.body.replace(RAW_GITHUB, "https://github.com/").replace(/^(https:\/\/github\.com\/[^/]+\/[^/]+\/)/, "$1blob/")
    : src.body;
  return base + s.path + "/SKILL.md";
}

function renderPlugins() {
  const rows = state.data.plugins.filter(matchesPlugin);
  $("pempty").hidden = rows.length > 0;
  const grid = $("pgrid");
  grid.innerHTML = "";
  for (const p of rows) {
    const row = document.createElement("article");
    row.className = "row plugin pcols";
    row.setAttribute("role", "listitem");
    const mine = machinePlugins() ? machinePlugins()[p.name] || null : null;
    const cmd = `claude plugin ${!mine ? "install" : !mine.enabled ? "enable" : mine.update ? "update" : "install"}` +
      ` ${p.name}@${marketplaceName()}`;
    row.innerHTML = `
      <div class="ident">
        <div class="line">
          <h4>${escapeHtml(p.name)}</h4>
          ${p.version ? `<span class="pill ver">v${escapeHtml(p.version)}</span>` : ""}
          ${p.curated ? curatedPill() : ""}
          ${hasInstalls() ? pluginRowState(p, mine) : ""}
        </div>
        <p>${escapeHtml(p.description || "")}</p>
        <div class="meta">
          <span class="src">from ${escapeHtml(p.source)}</span>
          ${p.category ? `<span class="pill">${escapeHtml(p.category)}</span>` : ""}
          ${(p.tags || []).map(t => `<span class="pill">${escapeHtml(t)}</span>`).join("")}
          ${p.homepage ? `<a class="src" href="${escapeHtml(p.homepage)}" target="_blank" rel="noopener">homepage ↗</a>` : ""}
        </div>
      </div>
      <button type="button" class="tolist">${p.skills ?? 0} skill${p.skills === 1 ? "" : "s"} →</button>
      <div class="install"><code>${escapeHtml(cmd)}</code><button type="button">Copy</button></div>`;
    row.querySelector(".tolist").onclick = () => { state.plug = p.name; state.view = "skills"; writeUrl(true); render(); scrollTo({ top: 0 }); };
    const copyBtn = row.querySelector(".install button");
    copyBtn.onclick = () => copyText(cmd, copyBtn, "Copy");
    grid.appendChild(row);
  }
}

function curatedPill() {
  const pill = '<span class="pill ok" title="Cherry-picks skills out of its source instead of shipping the whole repo">curated</span>';
  if (!docFile("glossary.md")) return pill;
  return '<a class="plain" href="./?view=docs&page=glossary.md#curated" data-doc="glossary.md#curated">' +
    pill + "</a>";
}

function pluginRowState(p, mine) {
  if (!mine) return '<span class="pill off" title="Offered by this registry, absent from this machine">not installed</span>';
  const scope = mine.projects.length ? `, local to ${mine.projects.join(", ")}` : "";
  const state = mine.enabled ? "installed" : "installed, disabled";
  const pill = `<span class="pill ${mine.enabled ? "ok" : "off"}" title="Version ${escapeHtml(mine.version || "unknown")} on this machine${escapeHtml(scope)}">${state}</span>`;
  if (!mine.update) return pill;
  return pill + `<span class="pill upd" title="This machine has ${escapeHtml(mine.version || "?")}; the registry offers ${escapeHtml(p.version || "?")}">update</span>`;
}

function renderAtlasView(shown, total) {
  const filtered = shown.length !== total;
  $("atotals").innerHTML = `A radial map of the catalog, grouped by category. Showing <b>${shown.length}</b> of <b>${total}</b> skills` +
    (filtered ? ', narrowed by the filters on Skills. <button type="button" id="atlas-reset" class="chip">Clear the filters</button>' : ".");
  if (filtered) $("atlas-reset").onclick = $("reset").onclick;
  renderAtlas(shown);
}

function renderStack() {
  const chosen = state.data.skills.filter(s => state.picked.has(skillKey(s)));
  $("stack").classList.toggle("hidden", chosen.length === 0);
  $("showpicked").setAttribute("aria-pressed", state.flag === "picked");
  if (!chosen.length) return;
  const on = chosen.reduce((n, s) => n + s.tokensAlwaysOn, 0);
  $("stackcount").innerHTML = `${chosen.length} skill${chosen.length === 1 ? "" : "s"} · <em>+${on.toLocaleString()}</em> always-on`;
  const blocks = stackBlocks(chosen);
  $("snippet").textContent = bundleYaml(blocks);
  renderNext(blocks);
}

// One block per source: the stack keys picks by source, and a plugin ships
// from exactly one.
function stackBlocks(chosen) {
  const bySource = {};
  for (const s of chosen) (bySource[s.source] ||= []).push(s.path);
  const sources = Object.keys(bySource).sort();
  return sources.map(source => ({
    name: sources.length > 1 ? `my-stack-${source}` : "my-stack",
    source,
    paths: bySource[source].sort(),
  }));
}

function bundleYaml(blocks) {
  const lines = [];
  for (const block of blocks) {
    lines.push(`  - name: ${block.name}`, `    source: ${block.source}`,
      "    description: Curated stack", "    skills:");
    for (const path of block.paths) lines.push(`      - ${path}`);
  }
  return lines.join("\n");
}

// The copied YAML is a plugin, not an install. Say what turns it into one.
function renderNext(blocks) {
  const installs = blocks.map(b => `claude plugin install ${b.name}@${state.data.registry}`);
  const commands = ["just dist", ...installs].join(" && ");
  $("next").innerHTML =
    `<span>Paste it under <code>plugins:</code> in your ${docLink("bundle", "glossary.md#bundle")}, then run:</span>` +
    `<span class="install"><code>${escapeHtml(commands)}</code>` +
    '<button type="button" id="copy-next">Copy</button></span>';
  const button = $("copy-next");
  button.onclick = () => copyText(commands, button, "Copy");
}

function copyText(text, button, label) {
  navigator.clipboard.writeText(text).then(() => {
    button.textContent = "Copied";
    setTimeout(() => { button.textContent = label; }, 1200);
  });
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

/* ---------- docs ---------- */
// The guides ship beside the catalog as markdown. The page renders them here
// so a term in the interface can link to the paragraph that defines it.
const docCache = new Map();

function docFile(name) {
  return state.docs.some(page => page.file === name) ? name : "";
}
// Docs link to each other the way they sit in the repo, but the build flattens
// them into one directory beside the catalog.
function docPath(href) {
  return href.replace(/^\.\//, "").replace(/^\.\.\//, "").replace(/^docs\//, "");
}

function docLink(label, target, cls = "gloss") {
  const [file, anchor] = target.split("#");
  if (!docFile(file)) return escapeHtml(label);
  return `<a class="${cls}" href="./?view=docs&page=${encodeURIComponent(file)}#${anchor || ""}"` +
    ` data-doc="${escapeHtml(target)}" title="What this means in Trove">${escapeHtml(label)}</a>`;
}

function openDoc(target) {
  const [file, anchor] = String(target).split("#");
  const known = docFile(file);
  if (known) state.page = known;
  state.anchor = anchor || "";
  state.view = "docs";
  writeUrl(true);
  render();
  scrollTo({ top: 0 });
}

function renderDocs() {
  const current = state.docs.find(p => p.file === state.page) || {};
  $("crumb-doc").textContent = current.label || current.title || "";
  const rail = $("doclist");
  rail.innerHTML = "";
  for (const page of state.docs) {
    const link = document.createElement("a");
    link.href = `./?view=docs&page=${encodeURIComponent(page.file)}`;
    link.textContent = page.label || page.title;
    link.setAttribute("aria-current", page.file === state.page ? "page" : "false");
    link.dataset.doc = page.file;
    rail.appendChild(link);
  }
  if (!state.page) {
    $("docbody").innerHTML = '<p class="docnote">This build ships no guides.</p>';
    return;
  }
  if (docCache.has(state.page)) return paintDoc(state.page);
  $("docbody").innerHTML = '<p class="docnote">Loading…</p>';
  const wanted = state.page;
  fetch("docs/" + encodeURIComponent(wanted))
    .then(r => (r.ok ? r.text() : Promise.reject(new Error(r.status))))
    .then(text => {
      docCache.set(wanted, mdToHtml(text));
      if (state.view === "docs" && state.page === wanted) paintDoc(wanted);
    })
    .catch(() => {
      $("docbody").innerHTML = `<p class="docnote">${escapeHtml(wanted)} is missing from this build.</p>`;
    });
}

function paintDoc(file) {
  const page = state.docs.find(p => p.file === file) || {};
  const verified = page.status === "verified";
  const label = verified ? "Verified" : "AI draft";
  const title = verified
    ? "A human has read this page and stands behind it"
    : "Drafted by Claude and not yet checked by a human";
  $("docbody").innerHTML =
    `<span class="docstatus${verified ? " verified" : ""}" title="${title}">${label}</span>` +
    docCache.get(file);
  if (!state.anchor) return;
  const target = document.getElementById(state.anchor);
  if (target) target.scrollIntoView({ block: "start" });
}

function slug(text) {
  return text.toLowerCase().replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-");
}

// A small markdown subset: what the shipped guides actually use.
function mdToHtml(src) {
  // Frontmatter carries the page's review status, which the header renders.
  const body = src.replace(/^---\n[\s\S]*?\n---\n/, "");
  const lines = body.replace(/\r\n/g, "\n").split("\n");
  const out = [];
  let para = [];
  const flush = () => { if (para.length) { out.push(`<p>${inline(para.join(" "))}</p>`); para = []; } };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (/^```/.test(line)) {
      flush();
      const code = [];
      while (++i < lines.length && !/^```/.test(lines[i])) code.push(lines[i]);
      out.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`);
    } else if (/^#{1,6}\s/.test(line)) {
      flush();
      const level = line.match(/^#+/)[0].length;
      const text = line.slice(level).trim();
      out.push(`<h${level} id="${escapeHtml(slug(text))}">${inline(text)}</h${level}>`);
    } else if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      flush();
      const ordered = /^\s*\d+\./.test(line);
      const items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
        items.push(lines[i].replace(/^\s*([-*]|\d+\.)\s+/, ""));
        i++;
      }
      i--;
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>${items.map(item => `<li>${inline(item)}</li>`).join("")}</${tag}>`);
    } else if (/^\s*\|/.test(line) && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1] || "")) {
      flush();
      const head = cells(line);
      const body = [];
      i += 2;
      while (i < lines.length && /^\s*\|/.test(lines[i])) body.push(cells(lines[i++]));
      i--;
      out.push('<div class="tablewrap"><table><thead><tr>' +
        head.map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>" +
        body.map(row => "<tr>" + row.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>").join("") +
        "</tbody></table></div>");
    } else if (/^\s*>\s?/.test(line)) {
      flush();
      out.push(`<blockquote>${inline(line.replace(/^\s*>\s?/, ""))}</blockquote>`);
    } else if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) {
      flush();
      out.push("<hr>");
    } else if (!line.trim()) {
      flush();
    } else {
      para.push(line.trim());
    }
  }
  flush();
  return out.join("\n");
}

function cells(row) {
  return row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
}

// Links come out first: a label like [`just`](url) would otherwise be split by
// the code-span pass before the link ever matched.
function inline(text) {
  const parked = [];
  const park = html => `\u0000${parked.push(html) - 1}\u0000`;
  const linked = escapeHtml(text)
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (m, alt, src) =>
      park(`<img alt="${alt}" src="docs/${docPath(src)}" loading="lazy">`))
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, label, href) => park(mdLink(spans(label), href)));
  return spans(linked).replace(/\u0000(\d+)\u0000/g, (m, i) => parked[i]);
}

// Code, bold, and italics over already-escaped text.
function spans(text) {
  return text
    .split(/(`[^`]+`)/g)
    .map(part =>
      part.startsWith("`") && part.endsWith("`")
        ? `<code>${part.slice(1, -1)}</code>`
        : part
            .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
            .replace(/(^|[\s(])_([^_]+)_(?=[\s).,;:]|$)/g, "$1<i>$2</i>"))
    .join("");
}

// Only three destinations are legitimate in a shipped guide: another page of
// this build, an anchor on this one, or a public URL.
function mdLink(label, href) {
  if (/^https?:/.test(href)) return `<a href="${href}" target="_blank" rel="noopener">${label}</a>`;
  if (href.startsWith("#")) return `<a href="${href}">${label}</a>`;
  const [file, anchor] = docPath(href).split("#");
  if (docFile(file)) {
    return `<a href="./?view=docs&page=${file}#${anchor || ""}" data-doc="${file}#${anchor || ""}">${label}</a>`;
  }
  return label;
}

/* ---------- atlas ---------- */
const atlas = { collapsed: {}, view: { x: 0, y: 0, k: 1 }, svgEl: null, vpEl: null, resizeTimer: null };
const MAP_W = 1700, MAP_CX = MAP_W / 2, MAP_CY = MAP_W / 2, MAP_R1 = 190, MAP_R2 = 620;
const ATLAS_STOP = new Set(
  ("a an and are as at be by do for from how in into is it its no not of on one or out over per " +
    "the this that to use via what when with your my you we our their vs new all any only also " +
    "after before never each more most much skills skill claude").split(" ")
);

function polar(a, r) { return [MAP_CX + Math.cos(a) * r, MAP_CY + Math.sin(a) * r]; }

function atlasClusters(skills) {
  const counts = new Map();
  for (const s of skills) counts.set(s.category, (counts.get(s.category) || 0) + 1);
  const sorted = [...counts].sort((a, b) => b[1] - a[1]);
  const kept = new Set(sorted.slice(0, 13).map(([id]) => id));
  const clusters = sorted.slice(0, 13).map(([id]) => ({ id, label: id }));
  if (sorted.length > 13) clusters.push({ id: "__other", label: "other" });
  const idFor = (cat) => (kept.has(cat) ? cat : "__other");
  return { clusters, idFor };
}

function buildMap(skills) {
  if (!skills.length) {
    return `<svg viewBox="0 0 ${MAP_W} ${MAP_W}" role="img" aria-label="No skills match">` +
      `<text class="root-label" x="${MAP_CX}" y="${MAP_CY}" text-anchor="middle">NOTHING MATCHES</text></svg>`;
  }
  const { clusters, idFor } = atlasClusters(skills);
  const groups = clusters.map(c => ({ c, skills: skills.filter(s => idFor(s.category) === c.id) }));
  let totalSlots = 0;
  for (const g of groups) { g.slots = atlas.collapsed[g.c.id] ? 2.4 : g.skills.length + 2.4; totalSlots += g.slots; }
  const unit = (Math.PI * 2) / totalSlots;
  const parts = [];
  let acc = -Math.PI / 2;
  for (const g of groups) {
    const a0 = acc; acc += g.slots * unit;
    const mid = a0 + (g.slots * unit) / 2;
    const cp = polar(mid, MAP_R1);
    const isCol = atlas.collapsed[g.c.id];
    const rp0 = polar(mid, 46), rp1 = polar(mid, MAP_R1 - 14);
    parts.push(`<line class="map-spoke" x1="${rp0[0].toFixed(1)}" y1="${rp0[1].toFixed(1)}" x2="${rp1[0].toFixed(1)}" y2="${rp1[1].toFixed(1)}"/>`);
    if (!isCol) {
      g.skills.forEach((s, j) => {
        const a = a0 + (j + 1.7) * unit;
        const lp = polar(a, MAP_R2);
        const rm = (MAP_R1 + MAP_R2) / 2;
        const c1 = polar(mid, rm), c2 = polar(a, rm);
        parts.push(`<path class="map-edge" d="M${cp[0].toFixed(1)} ${cp[1].toFixed(1)} C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${lp[0].toFixed(1)} ${lp[1].toFixed(1)}"/>`);
        const deg = a * 180 / Math.PI;
        const flip = Math.cos(a) < 0;
        const tp = polar(a, MAP_R2 + 12);
        const key = skillKey(s);
        const cls = "leaf" + (s.lint.length ? " flagged" : "") + (state.picked.has(key) ? " sel" : "");
        parts.push(`<g class="${cls}" data-key="${escapeHtml(key)}">` +
          `<circle cx="${lp[0].toFixed(1)}" cy="${lp[1].toFixed(1)}" r="3"/>` +
          `<text x="${tp[0].toFixed(1)}" y="${tp[1].toFixed(1)}" dominant-baseline="middle" text-anchor="${flip ? "end" : "start"}" ` +
          `transform="rotate(${(flip ? deg + 180 : deg).toFixed(1)} ${tp[0].toFixed(1)} ${tp[1].toFixed(1)})">${escapeHtml(s.name)}</text></g>`);
      });
    }
    const cdeg = mid * 180 / Math.PI;
    const cflip = Math.cos(mid) < 0;
    const ctp = polar(mid, MAP_R1 + 14);
    const label = `${escapeHtml(g.c.label).toUpperCase()} <tspan class="cnt">· ${g.skills.length}</tspan>`;
    parts.push(`<g class="cnode" data-c="${escapeHtml(g.c.id)}" role="button" aria-label="${escapeHtml(g.c.label)}">` +
      `<rect x="${(cp[0] - 3.5).toFixed(1)}" y="${(cp[1] - 3.5).toFixed(1)}" width="7" height="7"/>` +
      `<text x="${ctp[0].toFixed(1)}" y="${ctp[1].toFixed(1)}" dominant-baseline="middle" text-anchor="${cflip ? "end" : "start"}" ` +
      `transform="rotate(${(cflip ? cdeg + 180 : cdeg).toFixed(1)} ${ctp[0].toFixed(1)} ${ctp[1].toFixed(1)})">${isCol ? "▸ " : ""}${label}</text></g>`);
  }
  const rootSvg = `<text class="root-label" x="${MAP_CX}" y="${MAP_CY - 4}" text-anchor="middle">SKILLS</text>` +
    `<text class="root-count" x="${MAP_CX}" y="${MAP_CY + 14}" text-anchor="middle">${skills.length} shown</text>`;
  return `<svg viewBox="0 0 ${MAP_W} ${MAP_W}" role="img" ` +
    `aria-label="Radial map of ${skills.length} skills grouped into ${clusters.length} categories" preserveAspectRatio="xMidYMid meet">` +
    `<g id="atlas-vp">${parts.join("")}${rootSvg}</g></svg>`;
}

function applyAtlasView() {
  atlas.vpEl.setAttribute("transform", `translate(${atlas.view.x} ${atlas.view.y}) scale(${atlas.view.k})`);
}

function renderAtlas(skills) {
  const mapbox = $("mapbox");
  const tooltip = $("tooltip");
  const old = atlas.svgEl;
  const holder = document.createElement("div");
  holder.innerHTML = buildMap(skills);
  atlas.svgEl = holder.firstChild;
  if (old) old.remove();
  mapbox.insertBefore(atlas.svgEl, tooltip);
  atlas.vpEl = atlas.svgEl.querySelector("#atlas-vp");
  if (atlas.vpEl) applyAtlasView();
  attachAtlasEvents(skills);
  buildCloud(skills);
}

function attachAtlasEvents(skills) {
  const svgEl = atlas.svgEl;
  if (!skills.length) return;
  svgEl.addEventListener("wheel", e => {
    e.preventDefault();
    const rect = svgEl.getBoundingClientRect();
    const scale = Math.min(6, Math.max(0.5, atlas.view.k * (e.deltaY < 0 ? 1.12 : 0.89)));
    const vw = MAP_W / rect.width;
    const mx = (e.clientX - rect.left) * vw, my = (e.clientY - rect.top) * vw;
    atlas.view.x = mx - (mx - atlas.view.x) * (scale / atlas.view.k);
    atlas.view.y = my - (my - atlas.view.y) * (scale / atlas.view.k);
    atlas.view.k = scale;
    applyAtlasView();
  }, { passive: false });
  let drag = null;
  svgEl.addEventListener("pointerdown", e => {
    drag = { x: e.clientX, y: e.clientY, vx: atlas.view.x, vy: atlas.view.y, target: e.target, id: e.pointerId, moved: false };
  });
  svgEl.addEventListener("pointermove", e => {
    if (!drag) {
      const g = e.target.closest ? e.target.closest("g.leaf") : null;
      if (g) showAtlasTip(g, e, skills); else hideAtlasTip();
      return;
    }
    if (!drag.moved) {
      if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) < 5) return;
      drag.moved = true;
      svgEl.classList.add("panning");
      try { svgEl.setPointerCapture(drag.id); } catch (err) {}
      hideAtlasTip();
    }
    const rect = svgEl.getBoundingClientRect();
    const vw = MAP_W / rect.width;
    atlas.view.x = drag.vx + (e.clientX - drag.x) * vw;
    atlas.view.y = drag.vy + (e.clientY - drag.y) * vw;
    applyAtlasView();
  });
  svgEl.addEventListener("pointerup", () => {
    if (drag && !drag.moved) {
      const cn = drag.target.closest ? drag.target.closest("g.cnode") : null;
      if (cn) {
        const id = cn.getAttribute("data-c");
        atlas.collapsed[id] = !atlas.collapsed[id];
        render();
      } else {
        const g = drag.target.closest ? drag.target.closest("g.leaf") : null;
        if (g) togglePick(g.getAttribute("data-key"));
      }
    }
    drag = null;
    svgEl.classList.remove("panning");
  });
  svgEl.addEventListener("pointerleave", hideAtlasTip);
}

function showAtlasTip(g, e, skills) {
  const key = g.getAttribute("data-key");
  const s = skills.find(sk => skillKey(sk) === key);
  if (!s) return;
  const tooltip = $("tooltip");
  tooltip.innerHTML = `<div class="tn">${escapeHtml(s.name)}</div><div class="to">${escapeHtml(s.category)} · ${escapeHtml(s.source)}</div>` +
    (s.description ? `<div class="th">${escapeHtml(s.description)}</div>` : "") +
    `<div class="tt">+${s.tokensAlwaysOn} always-on</div>`;
  tooltip.style.display = "block";
  const br = $("mapbox").getBoundingClientRect();
  let x = e.clientX - br.left + 14, y = e.clientY - br.top + 14;
  if (x + 310 > br.width) x = e.clientX - br.left - 310;
  if (y + 90 > br.height) y = e.clientY - br.top - 90;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
}
function hideAtlasTip() { $("tooltip").style.display = "none"; }

function buildCloud(skills) {
  const box = $("cloudbox");
  box.innerHTML = "";
  if (!skills.length) return;
  const counts = new Map();
  for (const s of skills) {
    const seen = new Set();
    const words = (s.name.replace(/[:_-]/g, " ") + " " + (s.description || "") + " " + (s.tags || []).join(" "))
      .toLowerCase().split(/[^a-z0-9]+/);
    for (const w of words) {
      if (w.length < 3 || ATLAS_STOP.has(w) || seen.has(w)) continue;
      seen.add(w);
      counts.set(w, (counts.get(w) || 0) + 1);
    }
  }
  for (const w of [...counts.keys()]) {
    if (w.length > 3 && w.endsWith("s") && counts.has(w.slice(0, -1))) {
      counts.set(w.slice(0, -1), counts.get(w.slice(0, -1)) + counts.get(w));
      counts.delete(w);
    }
  }
  const words = [...counts.keys()].filter(w => counts.get(w) >= 2)
    .sort((a, b) => counts.get(b) - counts.get(a) || (a < b ? -1 : 1))
    .slice(0, 70);
  if (!words.length) return;
  const bw = box.clientWidth, bh = box.clientHeight;
  const cmax = counts.get(words[0]), cmin = counts.get(words[words.length - 1]);
  const active = (state.q || "").trim();
  const placed = [];
  words.forEach((w, wi) => {
    const t = cmax === cmin ? 1 : (counts.get(w) - cmin) / (cmax - cmin);
    const maxS = Math.max(22, Math.min(44, Math.round(bw / 11)));
    const size = Math.round(11 + (maxS - 11) * Math.pow(t, 0.7));
    const el = document.createElement("button");
    el.type = "button";
    el.className = "cw" + (t > 0.45 ? " big" : "") + (active === w ? " active" : "");
    el.style.fontSize = size + "px";
    el.textContent = w;
    el.title = `${counts.get(w)} skills`;
    el.setAttribute("aria-label", `${w}, ${counts.get(w)} skills; filters the catalog`);
    box.appendChild(el);
    const ww = el.offsetWidth, wh = el.offsetHeight;
    let ok = false, x = 0, y = 0;
    const sx = Math.max(1, Math.min(1.8, bw / bh)), sy = Math.max(1, Math.min(1.8, bh / bw));
    for (let k = 0; k < 3000; k++) {
      const r = 3.1 * Math.sqrt(k + wi * 0.7), th = (k + wi * 3) * 2.39996323;
      x = bw / 2 + r * Math.cos(th) * sx - ww / 2;
      y = bh / 2 + r * Math.sin(th) * sy - wh / 2;
      if (x < 6 || y < 6 || x + ww > bw - 6 || y + wh > bh - 6) continue;
      const clash = placed.some(p => !(x + ww + 5 < p.x || p.x + p.w + 5 < x || y + wh + 3 < p.y || p.y + p.h + 3 < y));
      if (!clash) { ok = true; break; }
    }
    if (!ok) { box.removeChild(el); return; }
    el.style.left = x + "px";
    el.style.top = y + "px";
    placed.push({ x, y, w: ww, h: wh });
    el.onclick = () => {
      const val = $("q").value.toLowerCase() === w ? "" : w;
      $("q").value = val;
      state.q = val;
      writeUrl();
      render();
    };
  });
}

addEventListener("resize", () => {
  if (state.view !== "atlas" || !state.data) return;
  clearTimeout(atlas.resizeTimer);
  atlas.resizeTimer = setTimeout(() => buildCloud(sortSkills(state.data.skills.filter(matches))), 200);
});
</script>
